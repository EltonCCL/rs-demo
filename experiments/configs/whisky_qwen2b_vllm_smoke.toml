[run]
run_id = "whisky_qwen2b_vllm_smoke"
description = "Small Qwen3-VL-Embedding-2B smoke run using vLLM's pooling runner."
top_k = 10
categories = ["text"]

[dataset]
adapter = "whisky"
catalogue_path = "data/extracted/product_parse_sample.jsonl"
dataset_id = "whisky"

[provider]
name = "qwen3_vl_embedding_vllm"
model_name = "Qwen/Qwen3-VL-Embedding-2B"
dimension = 2048
dtype = "bfloat16"
tensor_parallel_size = 1
gpu_memory_utilization = 0.85

[limits]
queries = 1
corpus = 30

[output]
runs_root = "data/experiments/runs"
datasets_root = "data/experiments/datasets"
