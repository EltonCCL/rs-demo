[run]
run_id = "whisky_qwen8b_smoke"
description = "Tiny Qwen3-VL-Embedding-8B smoke run using the SentenceTransformers runtime."
top_k = 10
categories = ["text"]
force = true

[dataset]
adapter = "whisky"
catalogue_path = "data/extracted/product_parse_sample.jsonl"
dataset_id = "whisky"

[provider]
name = "qwen3_vl_embedding"
model_name = "Qwen/Qwen3-VL-Embedding-8B"
dimension = 4096
runtime = "sentence-transformers"
normalize = true
device = "cuda:0"
local_files_only = true
batch_size = 2

[limits]
queries = 1
corpus = 30

[output]
runs_root = "data/experiments/runs"
datasets_root = "data/experiments/datasets"
