[project]
name = "rs-demo"
version = "0.1.0"
description = "Multimodal whisky recommendation demo."
authors = [{ name = "Elton Li" }]
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = ["google-genai==1.74.0", "numpy==2.2.6", "pymupdf==1.27.2.3"]

[project.scripts]
rs-demo = "rs_demo.cli:main"

[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.11.13"]
qwen = [
  "torch>=2.8.0",
  "transformers>=4.57.0",
  "qwen-vl-utils>=0.0.14",
  "sentence-transformers>=5.0.0",
]
qwen-vllm = ["vllm>=0.14.0", "qwen-vl-utils>=0.0.14"]
mmeb = ["huggingface-hub[cli]>=0.36.0", "hf-xet>=1.1.0"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"
