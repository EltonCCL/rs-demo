[project]
name = "rs-demo"
version = "0.1.0"
description = "Multimodal whisky recommendation demo."
authors = [{ name = "Elton Li" }]
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = ["pymupdf==1.27.2.3"]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.11.13"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"
